name: Public release safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-and-file-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject private files and likely secrets
        run: python3 scripts/check_public_release.py
